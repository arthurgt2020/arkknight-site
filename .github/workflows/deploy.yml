name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 2: pull hunting queries and intel repos into the build.
      # Uncomment once github.com/arthurgt2020/hunting-queries and /threat-intel exist.
      # - uses: actions/checkout@v4
      #   with: { repository: arthurgt2020/hunting-queries, path: external/hunting-queries }
      # - uses: actions/checkout@v4
      #   with: { repository: arthurgt2020/threat-intel, path: external/threat-intel }

      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
